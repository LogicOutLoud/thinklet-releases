name: Verify Windows release binaries (manual)

# Package and test the release binaries; application source is maintained separately.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows ${{ matrix.arch }}
    # GitHub requires release-write access to view unpublished drafts. The token is exposed only to the download step.
    permissions:
      contents: write
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Download and verify draft candidates
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = 'Thinklet-1.0.0-beta.40-win-${{ matrix.arch }}-preview.zip'
          $kit = 'Thinklet-1.0.0-beta.40-windows-packaging-kit.zip'
          gh release download v1.0.0-beta.40 --repo $env:GITHUB_REPOSITORY --pattern $zip --pattern $kit --pattern SHA256SUMS --dir payload
          if ($LASTEXITCODE -ne 0) { throw 'Could not download the draft candidates.' }
          foreach ($file in $zip, $kit) {
            $line = Get-Content payload/SHA256SUMS | Where-Object { $_ -match ('  ' + [regex]::Escape($file) + '$') }
            if (-not $line) { throw "Missing checksum for $file" }
            $expected = ($line -split '\s+')[0].ToLowerInvariant()
            $actual = (Get-FileHash "payload/$file" -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($expected -ne $actual) { throw "Checksum mismatch for $file" }
          }
          Expand-Archive "payload/$kit" kit
          Expand-Archive "payload/$zip" app
      - name: Launch portable app on Windows
        shell: pwsh
        run: ./kit/smoke-windows.ps1 -Executable app/Thinklet.exe
      - name: Build the installer from the verified application
        working-directory: kit
        run: npm ci --no-audit --no-fund && node build-installer.mjs ${{ matrix.arch }} ../app
      - name: Install and launch the application
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'kit/release/dist/*-win-${{ matrix.arch }}-preview.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Installer is missing.' }
          $process = Start-Process $installer.FullName -ArgumentList '/S' -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Installer exited with $($process.ExitCode)." }
          $exe = $null
          foreach ($i in 1..60) {
            $entries = @(
              Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue
              Get-ItemProperty 'HKCU:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue
            ) | Where-Object { $_.DisplayName -match '^Thinklet( |$)' -and $_.DisplayVersion -eq '1.0.0-beta.40' }
            foreach ($entry in $entries) {
              # electron-builder registers "Thinklet <version>" and puts the executable in DisplayIcon.
              if ($entry.DisplayIcon) {
                $candidate = ($entry.DisplayIcon -replace ',\d+$', '').Trim('"')
                if (Test-Path $candidate) { $exe = $candidate; break }
              }
            }
            if ($exe) { break }
            Start-Sleep -Seconds 1
          }
          $entries | Select-Object DisplayName, DisplayVersion, DisplayIcon | Format-List
          if (-not $exe) { throw 'The installer did not register a usable per-user installation.' }
          ./kit/smoke-windows.ps1 -Executable $exe -Kind installed
      - name: Retain installers and native check reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: |
            kit/release/dist/*.exe
            kit/release/dist/*.blockmap
            kit/release/dist/latest.yml
            release/windows-smoke-*.json
            release/windows-*.log
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
          overwrite: true
